control:
  keyboard:
    angle_step: 5
    enabled: true
    gripper_step: 10.0
    pos_step: 0.01
  pybullet:
    enabled: true
  vr:
    enabled: true
gripper:
  closed_angle: 45.0
  open_angle: 0.0
  # 自适应扭矩夹爪（Aider arm8，robstride_05 / RS05，力矩量程 ±17Nm）：
  #   扳机 = 目标角度（保留完整位置环，角度可控）；
  #   平时只用默认小扭矩 hold_torque 轻握；
  #   位置跟不上（抓到物体/被挡住）时逐步提高扭矩，最高到 max_torque（峰值）；
  #   一旦能跟上目标角度就回落到小扭矩 → 不较劲、不过流。
  #   硬件侧再写 LIMIT_TORQUE(0x700B) 兜底，输出永不超过上限 → 不会失能。
  force_control: true
  # --- 扭矩 (Nm) ---
  hold_torque: 0.4              # 默认保持力矩：能跟上目标时用这个（轻握）
  max_torque: 17.0              # 峰值扭矩上限：RS05 量程 ±17Nm（想保守可往下调）
  sustained_torque: 4.0         # 长时间顶住时回落的持续安全力矩
  peak_hold_seconds: 2.0        # 峰值最多持续这么久，超时回落到 sustained_torque
  # --- 自适应速率 ---
  torque_ramp_step: 0.25        # 每控制周期增加的扭矩(Nm)，位置跟不上时累加
  torque_decay_step: 0.5        # 每控制周期回落的扭矩(Nm)，跟得上时回落
  hold_tolerance_deg: 2.0       # 位置误差小于此值视为"能保持"(°)
  # --- 位置环增益（0 = 沿用驱动默认，与其他关节一致） ---
  gripper_kp: 0.0
  gripper_kd: 0.0
ik:
  use_reference_poses: true
  reference_poses_file: src/config/reference_poses.json
  position_error_threshold: 0.001
  hysteresis_threshold: 0.05
  movement_penalty_weight: 0.01
network:
  host_ip: 0.0.0.0
  websocket_port: 8442
  # 服务器地址配置（可选,优先使用命令行参数 --env-dev 或 --env-pro）
  # server_host: server.houqicg.com    # WebSocket Server 地址
  # api_host: bot.houqicg.com      # API Server 地址
  # server_port: 8442
  enable_webrtc: true   # 启用 aiortc WebRTC 视频推流（纯 Python，全平台可用）
  # --- 音频 ---
  audio_enabled: true
  audio_device: "Yundea A31-1"   # USB 音频设备 (card 2, 1 in + 2 out)
  audio_sample_rate: 16000
  # --- WebRTC 信令（复用 /ws/terminal 通道，无需独立 URL）---
  webrtc_room_id: robot-camera     # 房间 ID
  # ICE 服务器（兜底：若服务器未响应 webrtc_joined 时使用）
  ice_servers:
    - urls: ["stun:121.40.151.10:3478"]
    - urls: ["turn:121.40.151.10:3478"]
      username: "aider"
      credential: "aider123456"
    - urls: ["turns:server.houqicg.com:5349"]
      username: "aider"
      credential: "aider123456"
  # --- 摄像头 ---
  video_source: /dev/video0  # 摄像头设备路径
  camera_width: 640           # 采集宽度（带宽有限时建议 640）
  camera_height: 480          # 采集高度
  camera_fps: 25              # 帧率
  camera_fourcc: MJPG         # 编码格式
paths:
  urdf_path: URDF/SO100/so100.urdf
robot:
  type: aider              # 机器人类型: aider, aloha, openarmx, custom
  left_arm:
    enabled: true
    name: Left Arm
    port: /dev/ttySO100blue
  right_arm:
    enabled: true
    name: Right Arm
    port: /dev/ttySO100red
  send_interval: 0.02
  vr_to_robot_scale: 1
aloha:
  enabled: true              # 是否启用 Aloha 底盘
  initial_height: 0.3        # 初始高度(米)
