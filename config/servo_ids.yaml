# AlohaMini 舵机 ID 配置文件
# 根据你的实际硬件连接修改此文件

# 左臂总线（包含左臂 + 底盘 + 升降轴）
left_bus:
  port: "/dev/ttyUSB0"  # 左臂串口号
  
  # 左臂舵机 ID (1-7)
  left_arm:
    shoulder_pan: 1      # 肩关节旋转
    shoulder_lift: 2     # 肩关节升降
    elbow_flex: 3        # 肘关节弯曲
    wrist_flex: 4        # 腕关节弯曲
    wrist_roll: 5        # 腕关节旋转
    gripper: 6           # 夹爪
  
  # 底盘三轮 ID (8-10)
  base:
    left_wheel: 8        # 左轮
    back_wheel: 9        # 后轮
    right_wheel: 10      # 右轮
  
  # 升降轴 ID (11)
  lift_axis: 11          # 升降轴

# 右臂总线
right_bus:
  port: "/dev/ttyUSB1"  # 右臂串口号
  
  # 右臂舵机 ID (1-6)
  right_arm:
    shoulder_pan: 1      # 肩关节旋转
    shoulder_lift: 2     # 肩关节升降
    elbow_flex: 3        # 肘关节弯曲
    wrist_flex: 4        # 腕关节弯曲
    wrist_roll: 5        # 腕关节旋转
    gripper: 6           # 夹爪

# 使用说明：
# 1. 根据实际接线修改 port（串口号）
# 2. 使用 detect_servos.py 扫描确认每个舵机的实际 ID
# 3. 如果 ID 不匹配，用 servo_id_tool 重新设置
# 4. 底盘和升降轴必须接在左臂总线上
