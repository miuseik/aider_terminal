# ============================================================
# 新家 (src/) 独立容器 —— 与老业务 aiderminal 完全隔离
#
# 三个命令（与老系统完全对应）:
#   新电脑没 Docker:  ./scripts/setup_ros.sh
#   有 Docker 首次:   docker compose -f docker-compose.ros.yml up --build -d
#   之后每次启动:     ./start-ros.sh
#
# 进入容器: docker exec -it aider_ros2 bash
# ============================================================
# 独立 project name：避免 Docker 把老业务的 aiderminal 容器
# 误判为本项目"孤儿容器"（否则启动时会告警，且易误操作老系统）
name: aider_ros2

services:
  ros:
    build:
      context: .
      dockerfile: docker/Dockerfile.newros
    image: aider_ros2:latest
    container_name: aider_ros2
    network_mode: host
    ipc: host

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      # 与老系统隔离：老系统用默认 DOMAIN_ID=0，新家用 42
      # 否则 host 网络下两边 ROS 节点会互相发现，干扰演示
      - ROS_DOMAIN_ID=42

    # 只挂载 src/，不挂载老业务代码
    volumes:
      - ./src:/ws/src                      # 新家源码（读写，colcon 需要）
      - ./data:/ws/data                    # 数据目录（地图/模型/日志等）
      - ros_build:/ws/build                # 构建产物放卷内，避免污染主机
      - ros_install:/ws/install            # 安装产物
      - ros_log:/ws/log                    # 构建/运行日志
      - /tmp/.X11-unix:/tmp/.X11-unix:ro   # X11 转发（RViz/Gazebo 需要）

    # 串口设备直通（IMU: Hiwonder 十轴 AHRS / CH340）
    # IMU_PORT 可指定设备，默认 /dev/ttyUSB0
    devices:
      - "${IMU_PORT:-/dev/ttyUSB0}:${IMU_PORT:-/dev/ttyUSB0}"

    # entrypoint 已固化在镜像内（docker/entrypoint_newros.sh），无需挂载
    command: ["sleep", "infinity"]         # 构建后保持容器运行，便于 exec 进入

    stdin_open: true
    tty: true

volumes:
  ros_build:
  ros_install:
  ros_log:
