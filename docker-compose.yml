# Aider Terminal — 手臂机器人遥操作系统
#
# 启动（一键）:
#   docker compose up --build -d
#
# 停止:
#   docker compose down
#
# 切换机器人:
#   ROBOT_TYPE=aloha docker compose up --build -d

services:
  src:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: src
    network_mode: host
    ipc: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - ROBOT_TYPE=${ROBOT_TYPE:-aider}
      - NO_SIM=${NO_SIM:-false}
      - NO_VIZ=${NO_VIZ:-false}
      - ENV=${ENV:-pro}
      - QT_X11_NO_MITSHM=1

    # 使用 volume 挂载的入口脚本，改脚本无需重建镜像
    entrypoint: ["/bin/bash", "/app/scripts/docker_entrypoint.sh"]
    volumes:
      - .:/app                     # 项目根目录（源码 + URDF）读写挂载
      - /tmp/.X11-unix:/tmp/.X11-unix:ro  # X11 转发（仿真窗口）
      - /dev:/dev:rw                      # 让容器能看见主机设备，具体使用时机由业务代码决定

    restart: unless-stopped
    stdin_open: true
    tty: true
