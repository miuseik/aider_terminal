<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aider Pro — URDF 仿真</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  #canvas { display: block; }
  #panel {
    position: fixed; top: 10px; right: 10px;
    background: rgba(16,16,32,0.92); border: 1px solid #333;
    border-radius: 8px; padding: 12px; color: #ccc;
    max-height: 90vh; overflow-y: auto; width: 260px;
    font-size: 12px; z-index: 10;
  }
  #panel h3 { color: #6cf; margin: 0 0 8px; font-size: 14px; }
  .joint-group { margin-bottom: 6px; }
  .joint-group label { display: block; color: #999; margin-bottom: 2px; }
  .joint-group input[type=range] { width: 100%; }
  .joint-group .val { float: right; color: #6cf; font-family: monospace; }
  .arm-section { margin-bottom: 8px; }
  .arm-section h4 { color: #f90; font-size: 12px; margin: 6px 0 3px; border-bottom: 1px solid #333; padding-bottom: 2px; }
  #status {
    position: fixed; bottom: 10px; left: 10px;
    color: #666; font-size: 11px; z-index: 10;
  }
  #key-hint {
    position: fixed; bottom: 10px; right: 10px;
    color: #555; font-size: 10px; z-index: 10; text-align: right;
  }
  #chassis-pos {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: #0f0; font-size: 13px; font-family: monospace; z-index: 20;
    background: rgba(0,0,0,0.75); padding: 4px 14px; border-radius: 6px;
    border: 1px solid #0f0; pointer-events: none;
  }
  button {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 11px;
    margin-top: 6px; width: 100%;
  }
  button:hover { background: #444; }
</style>
</head>
<body>

<div id="canvas"></div>
<div id="panel">
  <h3>&#x1f527; 关节控制</h3>
  <div id="sliders"></div>
  <button id="reset-btn">&#x27f3; 复位所有关节</button>
  <button id="home-btn">&#x1f3e0; 初始姿态</button>
  <div id="mode-indicator" style="margin-top:8px; padding:4px 8px; border-radius:4px;
    background:#222; color:#6cf; font-size:11px; text-align:center;">
    🔧 关节模式
  </div>
</div>
<div id="status">加载中...</div>
<div id="chassis-pos">底盘: x=0.000 y=0.000 yaw=0.000</div>
<div id="key-hint">
  <span id="hint-text">
  键盘: WASD/QE 左臂 | IJKL/UO 右臂<br>
  ↑↓ 前进·后退 | ←→ 左转·右转 | 79 平移 | VB 升降<br>
  12 腰 | 34 脖子左右 | 56 脖子前后<br>
  <b>Tab 切换关节/目标点模式</b>
  </span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three/examples/jsm/loaders/STLLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/STLLoader.js",
    "three/examples/jsm/loaders/ColladaLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/ColladaLoader.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/loaders/OBJLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import URDFLoader from 'https://unpkg.com/urdf-loader@0.12.1/src/URDFLoader.js';

// ═══════════════════════════════════════════════════════
// 通信: 唯一一条 WebSocket 连接.
//   - 发出: {"type":"keydown"|"keyup"|"reset"|"home"|"set_joints", ...}
//   - 收到: 每 16ms 一帧 RobotState JSON
// 零 HTTP 请求, 零轮询.
// ═══════════════════════════════════════════════════════

// ── Three.js 初始化 ────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 5, 20);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(3, 2.5, 3.5);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas').appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight(0x404060, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 50;
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x6688cc, 1.5);
fill.position.set(-3, 2, -3);
scene.add(fill);

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
scene.add(new THREE.GridHelper(6, 20, 0x333355, 0x222244));

// OrbitControls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ── 全局状态 ───────────────────────────────────────────
const $status = document.getElementById('status');
const $indicator = document.getElementById('mode-indicator');
const $hint = document.getElementById('hint-text');
let robot = null;
let correctionGroup = null;
let baseGroup = null;           // 底盘世界位移 (平移+旋转)
let jointNames = [];
let jointMap = {};
let _dbgFrame = 0;
let eeSpheres = { left: null, right: null };
let targetSpheres = { left: null, right: null };

// ── WebSocket ──────────────────────────────────────────
const wsUrl = `ws://${location.host}/`;
let ws = null;
let _wsReady = false;

function connectWS() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    _wsReady = true;
    console.log('WebSocket connected');
    $status.textContent = $status.textContent.replace('WebSocket...', '✓ 已连接');
  };

  ws.onmessage = (event) => {
    try {
      const state = JSON.parse(event.data);
      applyState(state);
    } catch (e) {
      console.error('WS parse error:', e);
    }
  };

  ws.onclose = () => {
    _wsReady = false;
    console.log('WebSocket closed, reconnecting in 1s...');
    setTimeout(connectWS, 1000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

function wsSend(obj) {
  if (_wsReady && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── 加载 URDF ─────────────────────────────────────────
const CORRECTION_QUAT = new THREE.Quaternion().setFromAxisAngle(
  new THREE.Vector3(1, 0, 0), -Math.PI / 2
);

function loadURDF() {
  return new Promise((resolve, reject) => {
    $status.textContent = '加载 URDF ...';
    const loader = new URDFLoader();
    loader.packages = { 'aider_pro.SLDASM': './' };

    loader.loadMeshCb = (url, manager, done) => {
      const stlUrl = url.replace(/^package:\/\/.*?\/meshes\//, 'meshes/');
      const stlLoader = new STLLoader();
      stlLoader.load(stlUrl, (geometry) => {
        geometry.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({
          color: 0xd5cfbf, roughness: 0.6, metalness: 0.1,
        });
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        done(mesh);
      }, undefined, () => {
        const geo = new THREE.BoxGeometry(0.03, 0.03, 0.03);
        const mat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const cube = new THREE.Mesh(geo, mat);
        cube.castShadow = true;
        done(cube);
      });
    };

    loader.load('urdf/aider_pro.SLDASM.urdf', resolve, undefined, reject);
  });
}

async function initRobot() {
  robot = await loadURDF();

  correctionGroup = new THREE.Group();
  correctionGroup.name = 'urdf_correction';
  correctionGroup.quaternion.copy(CORRECTION_QUAT);
  correctionGroup.add(robot);

  // 底盘世界位移: 最外层 Group, 用于整体平移/旋转
  baseGroup = new THREE.Group();
  baseGroup.name = 'chassis_base';
  baseGroup.add(correctionGroup);
  scene.add(baseGroup);

  jointMap = robot.joints || {};
  jointNames = Object.keys(jointMap);
  console.log('URDF joints:', jointNames);

  for (const name of jointNames) {
    const joint = jointMap[name];
    const jType = joint.jointType || 'revolute';
    const lim = joint.limit || {};
    if (lim.lower === 0 && lim.upper === 0) {
      joint.limit = {
        lower: jType === 'prismatic' ? 0 : -Math.PI,
        upper: jType === 'prismatic' ? 0.3 : Math.PI,
      };
    }
  }

  buildUI(jointNames, jointMap);
  createMarkers();
  $status.textContent = `加载完成 — ${jointNames.length} 关节 | WebSocket...`;
}

// ── UI 面板 (滑块) ────────────────────────────────────
function buildUI(names, map) {
  const container = document.getElementById('sliders');
  container.innerHTML = '';

  const sections = [
    { title: '底盘 & 升降', keys: ['lift_Link'] },
    { title: '腰部', keys: ['waist_Link'] },
    { title: '头部', keys: ['head_Link', 'head_Link2'] },
    { title: '左臂', keys: ['left_arm1','left_arm2','left_arm3','left_arm4','left_arm5','left_arm6','left_arm7','left_arm8'] },
    { title: '右臂', keys: ['right_arm1','right_arm2','right_arm3','right_arm4','right_arm5','right_arm6','right_arm7','right_arm8'] },
  ];

  for (const sec of sections) {
    const existing = sec.keys.filter(k => map[k]);
    if (existing.length === 0) continue;

    const secDiv = document.createElement('div');
    secDiv.className = 'arm-section';
    const h4 = document.createElement('h4');
    h4.textContent = sec.title;
    secDiv.appendChild(h4);
    container.appendChild(secDiv);

    for (const jName of existing) {
      const joint = map[jName];
      const jType = joint.jointType || 'revolute';
      const limit = joint.limit || {};
      let lower = limit.lower, upper = limit.upper;
      if (lower == null || upper == null || (lower === 0 && upper === 0)) {
        lower = jType === 'prismatic' ? 0 : -Math.PI;
        upper = jType === 'prismatic' ? 0.3 : Math.PI;
      }
      const step = jType === 'prismatic' ? 0.001 : 0.01;

      const div = document.createElement('div');
      div.className = 'joint-group';

      const label = document.createElement('label');
      const valSpan = document.createElement('span');
      valSpan.className = 'val';
      valSpan.id = `val-${jName}`;
      valSpan.textContent = '0.00';
      label.textContent = jName + ' ';
      label.appendChild(valSpan);

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.id = `slider-${jName}`;
      slider.min = String(lower);
      slider.max = String(upper);
      slider.step = String(step);
      slider.value = '0';

      slider.addEventListener('input', () => {
        joint.setJointValue(parseFloat(slider.value));
        syncSlidersToBackend();
      });

      div.appendChild(label);
      div.appendChild(slider);
      secDiv.appendChild(div);
    }
  }
}

/** 收集滑块值 → WebSocket 发送 */
let _sliderSyncTimer = null;
function syncSlidersToBackend() {
  if (_sliderSyncTimer) clearTimeout(_sliderSyncTimer);
  _sliderSyncTimer = setTimeout(() => {
    const jv = {};
    for (const name of jointNames) {
      const slider = document.getElementById(`slider-${name}`);
      if (slider) jv[name] = parseFloat(slider.value);
    }
    wsSend({ type: 'set_joints', joint_values: jv });
  }, 50);
}

// ── 标记球体 ──────────────────────────────────────────
function createMarkers() {
  const eeGeo = new THREE.SphereGeometry(0.02, 16, 16);
  const leftEE = new THREE.Mesh(eeGeo, new THREE.MeshStandardMaterial({
    color: 0xff3333, roughness: 0.3, emissive: 0x330000,
  }));
  const rightEE = new THREE.Mesh(eeGeo, new THREE.MeshStandardMaterial({
    color: 0x3366ff, roughness: 0.3, emissive: 0x000033,
  }));
  correctionGroup.add(leftEE);
  correctionGroup.add(rightEE);
  eeSpheres.left = leftEE;
  eeSpheres.right = rightEE;

  function makeTarget(color, emissive) {
    const group = new THREE.Group();
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 24, 24),
      new THREE.MeshStandardMaterial({
        color, roughness: 0.4, emissive,
        emissiveIntensity: 0.6, transparent: true, opacity: 0.8,
      })
    );
    group.add(sphere);
    const ringGeo = new THREE.RingGeometry(0.035, 0.04, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color, side: THREE.DoubleSide, transparent: true, opacity: 0.5
    });
    [0, 1, 2].forEach(axis => {
      const ring = new THREE.Mesh(ringGeo, ringMat);
      if (axis === 0) ring.rotation.y = Math.PI / 2;
      else if (axis === 2) ring.rotation.x = Math.PI / 2;
      group.add(ring);
    });
    correctionGroup.add(group);
    return group;
  }
  targetSpheres.left = makeTarget(0x33ff33, 0x003300);
  targetSpheres.right = makeTarget(0x33ffff, 0x003333);
}

// ── 应用后端状态到渲染 ────────────────────────────────
function applyState(state) {
  if (!robot?.joints) return;

  const jv = state.joint_values || {};
  for (const [name, val] of Object.entries(jv)) {
    const joint = jointMap[name];
    if (joint?.setJointValue) {
      joint.setJointValue(val);
    }
    const slider = document.getElementById(`slider-${name}`);
    const span = document.getElementById(`val-${name}`);
    if (slider && Math.abs(parseFloat(slider.value) - val) > 0.001) {
      slider.value = val;
    }
    if (span) span.textContent = Number(val).toFixed(2);
  }

  if (state.ee_left && eeSpheres.left) {
    eeSpheres.left.position.set(state.ee_left[0], state.ee_left[1], state.ee_left[2]);
  }
  if (state.ee_right && eeSpheres.right) {
    eeSpheres.right.position.set(state.ee_right[0], state.ee_right[1], state.ee_right[2]);
  }

  if (state.target_left && targetSpheres.left) {
    targetSpheres.left.position.set(state.target_left[0], state.target_left[1], state.target_left[2]);
  }
  if (state.target_right && targetSpheres.right) {
    targetSpheres.right.position.set(state.target_right[0], state.target_right[1], state.target_right[2]);
  }

  // 底盘世界位移
  // correctionGroup(X:-90°) 将 URDF(Z-up) → Three.js(Y-up):
  //   URDF +X = Three.js +X (前)
  //   URDF +Y = Three.js -Z (左)
  //   URDF +Z = Three.js +Y (上)
  if (baseGroup && (state.base_x != null)) {
    baseGroup.position.x = state.base_x;            // URDF X → Three.js X (前)
    baseGroup.position.z = -(state.base_y ?? 0);    // URDF +Y → Three.js -Z (左)
    baseGroup.rotation.y = (state.base_yaw ?? 0);   // URDF yaw → Three.js Y  (正:逆时针=左转)
    if (++_dbgFrame % 120 === 0 || Math.abs(state.base_x) > 0.001 || Math.abs(state.base_y??0) > 0.001 || Math.abs(state.base_yaw??0) > 0.001) {
      if (Math.abs(state.base_x) > 0.001 || Math.abs(state.base_y??0) > 0.001 || Math.abs(state.base_yaw??0) > 0.001)
        console.log('[viewer] MOVING! base_x='+state.base_x.toFixed(3)+' base_y='+(state.base_y??0).toFixed(3)+' base_yaw='+(state.base_yaw??0).toFixed(3), 'bgPos=', baseGroup.position.toArray().map(v=>v.toFixed(3)));
    }
  }

  const targetMode = state.target_mode;
  if (targetMode) {
    $indicator.innerHTML = '🎯 目标点模式 (IK)';
    $indicator.style.color = '#3f3';
    $hint.innerHTML = '左目标: WASD/QE | 右目标: IJKL/UO<br>↑↓←→79VB 底盘 | 12腰 3456脖子 | <b>Tab 切回关节模式</b>';
  } else {
    $indicator.innerHTML = '🔧 关节模式';
    $indicator.style.color = '#6cf';
    $hint.innerHTML = '键盘: WASD/QE 左臂 | IJKL/UO 右臂<br>↑↓←→79VB 底盘 | 12腰 3456脖子<br><b>Tab 切换至目标点模式</b>';
  }
}

// ── 键盘事件 → WebSocket ──────────────────────────────
const keysDown = new Set();

const PREVENT_KEYS = new Set([
  'tab','arrowup','arrowdown','arrowleft','arrowright',
  'q','w','e','r','t','y','a','s','d','f','g','h',
  'z','x','c','v','u','i','o','j','k','l',
]);

window.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') e.preventDefault();
  if (e.target.tagName === 'INPUT') return;
  const key = e.key.toLowerCase();
  if (keysDown.has(key)) return;
  keysDown.add(key);
  if (PREVENT_KEYS.has(key)) e.preventDefault();
  wsSend({ type: 'keydown', key });
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  keysDown.delete(key);
  wsSend({ type: 'keyup', key });
});

// ── 按钮 ──────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  wsSend({ type: 'reset' });
});

document.getElementById('home-btn').addEventListener('click', () => {
  wsSend({ type: 'home' });
});

// ── 渲染循环 ──────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  // 摄像机跟踪底盘位移 (跟随速度 0.02, 让位移可见)
  if (baseGroup) {
    controls.target.lerp(baseGroup.position.clone().setY(0.8), 0.02);
    // 更新底盘坐标显示
    const el = document.getElementById('chassis-pos');
    if (el) {
      // baseGroup.position.z = -(URDF Y),  rotation.y = URDF yaw
      const urfY = -baseGroup.position.z;
      const urfYaw = baseGroup.rotation.y;
      el.textContent = `底盘: x=${baseGroup.position.x.toFixed(3)} y=${urfY.toFixed(3)} yaw=${((urfYaw * 180 / Math.PI) % 360).toFixed(1)}°`;
      const moved = Math.abs(baseGroup.position.x) > 0.005 || Math.abs(baseGroup.position.z) > 0.005 || Math.abs(baseGroup.rotation.y) > 0.005;
      if (moved) el.style.color = '#ff0';
      else el.style.color = '#0f0';
    }
  }
  controls.update();
  renderer.render(scene, camera);
}

// ── 启动 ──────────────────────────────────────────────
initRobot().then(() => {
  connectWS();
  animate();
});
</script>
</body>
</html>
